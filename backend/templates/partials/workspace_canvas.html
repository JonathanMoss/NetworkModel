    <!-- Main Interactive Schematic / Geospatial Canvas -->
    <main class="canvas-wrap view-mode-tps" id="canvas-container">
      <div class="dual-view-container" id="dual-view-container">
        <!-- Left Pane: TPS Signalling Schematic -->
        <div class="dual-pane dual-pane-tps" id="pane-tps">
          <div class="pane-badge tps-badge" id="badge-tps">
            <span class="badge-icon">🔀</span>
            <span class="badge-title">TPS Schematic</span>
            <span class="badge-sync-tag hidden" id="tps-sync-tag">⚡ Correlated</span>
            <button class="pane-fit-btn" id="btn-fit-tps" title="Fit TPS Schematic Network">Fit TPS</button>
          </div>
          <canvas id="schematic-canvas"></canvas>
        </div>

        <!-- Draggable Resizer Split Divider -->
        <div class="split-divider" id="split-divider">
          <div class="divider-handle" title="Drag to resize panes">
            <span class="divider-icon">⋮</span>
          </div>
        </div>

        <!-- Right Pane: NWR Geospatial Track Corridor -->
        <div class="dual-pane dual-pane-nwr" id="pane-nwr">
          <div class="pane-badge nwr-badge" id="badge-nwr">
            <span class="badge-icon">🌍</span>
            <span class="badge-title">NWR Geographic Corridor (OSGB36)</span>
            <span class="badge-sync-tag hidden" id="nwr-sync-tag">⚡ Correlated</span>
            <button class="pane-fit-btn" id="btn-fit-nwr" title="Fit NWR Corridor">Fit NWR</button>
          </div>
          <canvas id="nwr-canvas"></canvas>
        </div>
      </div>

      <!-- Floating Pane Fold / Unfold Controls -->
      <button id="btn-toggle-left-pane" class="pane-toggle-btn pane-toggle-left" title="Fold / Unfold Left Layers Pane">
        &#9664; Hide Layers
      </button>
      <button id="btn-toggle-right-pane" class="pane-toggle-btn pane-toggle-right" title="Fold / Unfold Right Inspector Pane">
        Hide Inspector &#9654;
      </button>

      <!-- Floating Zoom Controls -->
      <div class="zoom-controls">
        <button id="btn-zoom-in" title="Zoom In">+</button>
        <button id="btn-zoom-out" title="Zoom Out">&minus;</button>
        <button id="btn-clear-highlight" class="hidden" title="Clear Highlighted Topology Path">Clear Highlight</button>
      </div>

      <!-- Hover Tooltip / Submenu -->
      <div id="hover-tooltip" class="hover-tooltip hidden"></div>


      {% include "partials/profile_drawer.html" %}
    </main>
